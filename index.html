<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SA Events</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f6fb;
      color: #111827;
    }
    body {
      margin: 0;
      padding: 0;
      background: #f4f6fb;
    }
    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
    }
    header {
      margin-bottom: 20px;
    }
    h1 {
      margin: 0;
      font-size: 2rem;
      letter-spacing: -0.03em;
    }
    .subtitle {
      margin: 8px 0 18px;
      color: #4b5563;
      max-width: 720px;
      line-height: 1.6;
    }
    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 24px;
    }
    .filter-button {
      border: none;
      border-radius: 999px;
      padding: 10px 18px;
      background: #e5e7eb;
      color: #111827;
      cursor: pointer;
      transition: transform 0.18s ease, background 0.18s ease;
      font-weight: 600;
    }
    .filter-button.active {
      background: #4338ca;
      color: #ffffff;
      box-shadow: 0 12px 30px rgba(67, 56, 202, 0.18);
    }
    .filter-button:hover {
      transform: translateY(-1px);
    }
    .events-grid {
      display: grid;
      gap: 18px;
    }
    .category-block {
      margin-bottom: 28px;
    }
    .category-title {
      margin: 0 0 14px;
      font-size: 1.4rem;
      font-weight: 700;
      color: #111827;
    }
    .event-card {
      background: #ffffff;
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 22px 60px rgba(15, 23, 42, 0.08);
      display: grid;
      gap: 10px;
    }
    .event-card h2 {
      margin: 0;
      font-size: 1.18rem;
      line-height: 1.3;
    }
    .event-meta {
      display: grid;
      gap: 8px;
      color: #4b5563;
      font-size: 0.96rem;
    }
    .event-meta span {
      display: inline-block;
    }
    .event-meta .source {
      color: #6b7280;
      font-size: 0.88rem;
    }
    .event-footer {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      background: #2563eb;
      color: #ffffff;
    }
    .event-label {
      color: #6b7280;
      font-size: 0.88rem;
    }
    .message-card {
      background: #ffffff;
      padding: 32px;
      border-radius: 20px;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.06);
      text-align: center;
      margin-top: 24px;
    }
    .message-card h2 {
      margin: 0 0 12px;
      font-size: 1.4rem;
    }
    .message-card p {
      margin: 0 0 10px;
      color: #4b5563;
      line-height: 1.7;
    }
    .note {
      display: block;
      margin-top: 16px;
      color: #374151;
      font-size: 0.95rem;
      background: #eef2ff;
      padding: 14px 18px;
      border-radius: 16px;
    }
    @media (max-width: 768px) {
      .page {
        padding: 18px;
      }
      .event-card {
        padding: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>SA Events</h1>
      <p class="subtitle">Browse local South African events grouped by category. Filter by type, sort by date, and explore event details quickly.</p>
    </header>

    <div class="filter-row" id="category-filters"></div>
    <div id="event-count" class="event-label"></div>
    <div class="events-grid" id="events-container"></div>
    <div class="message-card" id="message-card" style="display:none;">
      <h2>Nothing to show</h2>
      <p id="message-text">No events were found for the selected category.</p>
      <p class="note">If the page cannot load data, start a local server with <code>python -m http.server</code> in this folder.</p>
    </div>
  </div>

  <script>
    const categories = ["All", "Party", "Music", "Sports", "Comedy", "Expo"];
    let selectedCategory = "All";
    let eventData = [];

    document.addEventListener("DOMContentLoaded", () => {
      renderFilters();
      loadEvents();
    });

    function loadEvents() {
      fetch("sa_events.json")
        .then(response => {
          if (!response.ok) {
            throw new Error("Failed to load JSON file.");
          }
          return response.json();
        })
        .then(data => {
          eventData = data.map(event => ({
            ...event,
            date: event.date || "1970-01-01",
            time: event.time || "00:00"
          }));
          renderEvents();
        })
        .catch(error => {
          showMessage("Unable to load sa_events.json. Open this page through a local server or check the file location.");
          console.error(error);
        });
    }

    function renderFilters() {
      const container = document.getElementById("category-filters");
      container.innerHTML = "";
      categories.forEach(category => {
        const button = document.createElement("button");
        button.className = "filter-button" + (category === selectedCategory ? " active" : "");
        button.textContent = category;
        button.addEventListener("click", () => {
          selectedCategory = category;
          renderFilters();
          renderEvents();
        });
        container.appendChild(button);
      });
    }

    function renderEvents() {
      const container = document.getElementById("events-container");
      const messageCard = document.getElementById("message-card");
      container.innerHTML = "";
      messageCard.style.display = "none";

      const filtered = eventData
        .filter(event => selectedCategory === "All" || event.category === selectedCategory)
        .sort((a, b) => compareEvents(a, b));

      if (filtered.length === 0) {
        showMessage("No events found");
        return;
      }

      const grouped = groupBy(filtered, event => event.category || "Other");
      let renderedCount = 0;

      Object.keys(grouped).forEach(category => {
        const categoryBlock = document.createElement("section");
        categoryBlock.className = "category-block";

        const title = document.createElement("h2");
        title.className = "category-title";
        title.textContent = category;
        categoryBlock.appendChild(title);

        grouped[category].forEach(event => {
          categoryBlock.appendChild(createEventCard(event));
          renderedCount += 1;
        });

        container.appendChild(categoryBlock);
      });

      document.getElementById("event-count").textContent = `${renderedCount} event${renderedCount === 1 ? "" : "s"}`;
    }

    function compareEvents(a, b) {
      const dateA = new Date(`${a.date}T${a.time}`);
      const dateB = new Date(`${b.date}T${b.time}`);
      return dateA - dateB;
    }

    function groupBy(array, keyFn) {
      return array.reduce((acc, item) => {
        const key = keyFn(item);
        acc[key] = acc[key] || [];
        acc[key].push(item);
        return acc;
      }, {});
    }

    function createEventCard(event) {
      const card = document.createElement("article");
      card.className = "event-card";

      const title = document.createElement("h2");
      title.textContent = event.title;
      card.appendChild(title);

      const meta = document.createElement("div");
      meta.className = "event-meta";
      meta.innerHTML = `
        <span>${formatDate(event.date)} • ${event.time}</span>
        <span>${event.location}${event.address ? ` • ${event.address}` : ""}</span>
      `;
      card.appendChild(meta);

      if (event.price) {
        const priceLine = document.createElement("div");
        priceLine.className = "event-meta";
        priceLine.innerHTML = `<span>Price: ${event.price}</span>`;
        card.appendChild(priceLine);
      }

      const footer = document.createElement("div");
      footer.className = "event-footer";
      footer.innerHTML = `
        <span class="event-label">Source: ${event.source}</span>
        ${isToday(event.date) ? '<span class="badge">Today</span>' : ""}
      `;
      card.appendChild(footer);

      return card;
    }

    function formatDate(dateString) {
      const date = new Date(dateString);
      if (isNaN(date)) return dateString;
      return new Intl.DateTimeFormat("en-GB", { weekday: "short", day: "2-digit", month: "short" }).format(date);
    }

    function isToday(dateString) {
      const date = new Date(dateString);
      const today = new Date();
      return date.toDateString() === today.toDateString();
    }

    function showMessage(message) {
      const messageCard = document.getElementById("message-card");
      messageCard.style.display = "block";
      document.getElementById("message-text").textContent = message;
      document.getElementById("events-container").innerHTML = "";
      document.getElementById("event-count").textContent = "";
    }
  </script>
</body>
</html>
